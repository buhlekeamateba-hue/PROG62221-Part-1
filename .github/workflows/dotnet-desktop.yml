name: .NET CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Find, restore, and build C# projects
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.csproj)

          if ($projects.Count -eq 0) {
            throw "No .csproj project file was found in this repository."
          }

          foreach ($project in $projects) {
            Write-Host "Building: $($project.FullName)"
            dotnet restore $project.FullName
            dotnet build $project.FullName --no-restore --configuration Release
          }
