name: .NET CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Downloads your repository files onto GitHub's build computer.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs .NET 8 for your Cybot console application.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Downloads any project dependencies, such as System.Windows.Extensions.
      - name: Restore dependencies
        run: dotnet restore

      # Builds Cybot in Release mode.
      - name: Build project
        run: dotnet build --no-restore --configuration Release
